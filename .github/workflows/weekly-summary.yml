# 매주 월요일 오전 9시(KST) 주간 요약 이슈를 만든다. 로직은 .github/scripts/weekly.js
name: 주간 요약

on:
  schedule:
    - cron: "0 0 * * 1"   # 월요일 UTC 00:00 = KST 09:00
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github
      - uses: actions/github-script@v8
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/weekly.js`);
            await run({ github, context, core });
