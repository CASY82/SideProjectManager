name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  automation-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test ".github/scripts/*.test.js"
      - run: bash -n scripts/init-project.sh

  local-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: local-hub 가 있는지 확인
        id: check
        run: echo "exists=$([ -f local-hub/app/pom.xml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        if: steps.check.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: local-hub/app/pom.xml
      - name: 테스트
        if: steps.check.outputs.exists == 'true'
        working-directory: local-hub/app
        run: ./mvnw -B -q test
