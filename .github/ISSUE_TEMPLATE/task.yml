name: 할 일
description: 해야 할 작업을 등록합니다. 마감일을 적으면 자동으로 알림이 갑니다.
labels: ["type: task"]
body:
  - type: textarea
    id: description
    attributes:
      label: 내용
      description: 무엇을 왜 해야 하는지
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 무엇이 되면 끝난 것인지 (체크리스트 추천)
      placeholder: |
        - [ ] API 응답 형식 확정
        - [ ] 테스트 추가
  - type: input
    id: due
    attributes:
      label: 마감일
      description: YYYY-MM-DD 형식. 비워 두면 마감 알림을 보내지 않습니다.
      placeholder: "2026-11-15"
  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - P0 - 긴급
        - P1 - 높음
        - P2 - 보통
      default: 2
