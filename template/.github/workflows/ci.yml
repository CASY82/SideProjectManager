# 저장소 루트의 빌드 파일을 보고 알맞은 빌드·테스트를 돌린다.
#   pom.xml → Maven, build.gradle(.kts) → Gradle, package.json → npm, requirements.txt / pyproject.toml → Python
# 프론트·백엔드를 폴더로 나눈 경우 아래 WORKDIR 을 바꾸거나 job 을 복사해서 폴더마다 하나씩 두면 된다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # ---------- Java (Maven) ----------
      - if: hashFiles('pom.xml') != ''
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Maven 빌드·테스트
        if: hashFiles('pom.xml') != ''
        run: |
          if [ -x ./mvnw ]; then ./mvnw -B verify; else mvn -B verify; fi

      # ---------- Java/Kotlin (Gradle) ----------
      - if: hashFiles('build.gradle', 'build.gradle.kts') != ''
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Gradle 빌드·테스트
        if: hashFiles('build.gradle', 'build.gradle.kts') != ''
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew && ./gradlew build; else gradle build; fi

      # ---------- Node ----------
      - if: hashFiles('package.json') != ''
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm 설치·테스트·빌드
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm test --if-present
          npm run build --if-present

      # ---------- Python ----------
      - if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Python 설치·테스트
        if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
          pip install pytest
          if ls tests test 2>/dev/null | grep -q .; then pytest; else echo "tests 폴더가 없어 테스트를 건너뜁니다"; fi

      - name: 빌드 파일이 없을 때
        if: hashFiles('pom.xml', 'build.gradle', 'build.gradle.kts', 'package.json', 'requirements.txt', 'pyproject.toml') == ''
        run: echo "::notice::빌드 파일을 찾지 못해 검사할 것이 없습니다. 코드를 추가하면 자동으로 빌드·테스트합니다."
