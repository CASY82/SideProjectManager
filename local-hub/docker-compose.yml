# 모든 프로젝트가 함께 쓰는 공통 서비스. 필요한 것만 프로필로 골라 띄운다.
# Local Hub 앱은 시작할 때 공유 네트워크를 만들고 hub.yml 의 infra-profiles 에 적힌 프로필을 올린다.
# 앱 없이 직접 띄울 때는 네트워크를 먼저 만든다.
#   docker network create sidehub
#   docker compose -p sidehub --profile postgres --profile redis up -d
# 각 프로젝트의 서비스도 이 네트워크에 붙으므로 postgres:5432 처럼 서비스 이름으로 접속한다.
# 접속 정보는 .env 로 바꿀 수 있다 (.env.example 참고).

services:
  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    profiles: [mysql]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
    ports: ["${MYSQL_PORT:-3306}:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    profiles: [redis]
    restart: unless-stopped
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    profiles: [rabbitmq]
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"   # 관리 화면
    volumes: [rabbitmq-data:/var/lib/rabbitmq]

volumes:
  postgres-data:
  mysql-data:
  redis-data:
  rabbitmq-data:

networks:
  default:
    # hub.yml 의 network 를 바꿨다면 .env 의 HUB_NETWORK 도 같은 값으로 맞춘다
    name: ${HUB_NETWORK:-sidehub}
    external: true
