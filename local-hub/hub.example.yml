# Local Hub 설정. hub.sh(hub.cmd) 를 처음 실행하면 이 파일이 hub.yml 로 복사된다.
# hub.yml 은 팀마다 다르므로 git 에 올리지 않는다.
hub:
  # docker compose 프로젝트 이름 (컨테이너 이름 앞에 붙는다)
  project-name: sidehub
  compose-files:
    - docker-compose.yml
    - docker-compose.apps.yml
  # 앱이 시작할 때 함께 띄울 공통 서비스 (docker-compose.yml 의 profiles)
  infra-profiles:
    - postgres
    - redis
  # 새 커밋을 확인하는 주기 (30s, 1m, 5m ...)
  poll-interval: 60s
  # git/docker 명령 하나가 이 시간을 넘기면 실패로 본다
  command-timeout: 15m
  # 값을 넣으면 "배포" 요청에 X-Hub-Token 헤더가 필요하다. 같은 네트워크에 모르는 사람이 있으면 설정할 것
  api-token: ""

  # 배포가 실패하거나 롤백되면 GitHub 이슈를 자동으로 만들고, 다음 배포가 성공하면 닫는다
  issues:
    enabled: false
    # Issues 읽기·쓰기 권한이 있는 토큰. 파일에 직접 적지 말고 환경 변수 HUB_GITHUB_TOKEN 으로 넘기는 것을 추천
    token: ${HUB_GITHUB_TOKEN:}
    labels: [local-hub, "type: bug"]
    # 빌드 출력 끝부분을 이슈에 넣을지. 공개 저장소라면 출력에 비밀 값이 찍히지 않는지 확인할 것
    include-output: true

  # 감시할 저장소 목록. name 은 docker-compose.apps.yml 의 서비스 이름과 같게 맞춘다.
  services: []
  # services:
  #   - name: api
  #     repo: https://github.com/your-team/api.git
  #     branch: main
  #   - name: web
  #     repo: git@github.com:your-team/web.git
  #     branch: develop
  #     compose-service: web   # compose 서비스 이름이 name 과 다를 때만
  #     issue-repo: your-team/web  # 실패 이슈를 올릴 저장소. 비우면 repo 주소에서 알아낸다
