# 팀원들이 만드는 서비스. Local Hub 가 workspace/<이름> 에 저장소를 clone 하고 여기 적힌 대로 빌드한다.
# hub.yml 의 services[].name (또는 compose-service) 과 아래 서비스 이름이 같아야 한다.
#
# 같은 compose 프로젝트 안이라 서비스 이름이 곧 호스트 이름이다.
# 예) 앱에서 DB 주소는 localhost 가 아니라 postgres:5432

services:
  # 예시: 아래 주석을 풀고 hub.yml 에 api 서비스를 등록하면 된다.
  # api:
  #   build: ./workspace/api          # 저장소 루트에 Dockerfile 이 있어야 한다
  #   restart: unless-stopped
  #   ports: ["8080:8080"]
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/app
  #     SPRING_DATASOURCE_USERNAME: app
  #     SPRING_DATASOURCE_PASSWORD: app
  #     SPRING_DATA_REDIS_HOST: redis
  #
  # web:
  #   build:
  #     context: ./workspace/web
  #     dockerfile: Dockerfile
  #   restart: unless-stopped
  #   ports: ["3000:3000"]
  #   environment:
  #     API_URL: http://api:8080

  # 서비스가 하나도 없을 때 compose 가 오류를 내지 않도록 두는 자리. 실제 서비스를 추가하면 지워도 된다.
  placeholder:
    image: busybox:1.37
    profiles: [never]
